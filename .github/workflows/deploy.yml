name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer push waits for the running one to finish.
concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SSH_OPTS: -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o StrictHostKeyChecking=yes
    steps:
      - uses: actions/checkout@v4

      # NEXT_PUBLIC_API_URL and FRONTEND_URL are baked into the web image at
      # build time. WEB_ENV_PRODUCTION holds them as KEY=value lines.
      - name: Read web build env
        run: |
          printf '%s\n' "${{ secrets.WEB_ENV_PRODUCTION }}" > web.env
          for k in NEXT_PUBLIC_API_URL FRONTEND_URL; do
            v=$(grep -E "^$k=" web.env | head -1 | cut -d= -f2-)
            [ -n "$v" ] || { echo "::error::$k missing from WEB_ENV_PRODUCTION"; exit 1; }
            echo "$k=$v" >> "$GITHUB_ENV"
          done
          rm web.env

      - uses: docker/setup-buildx-action@v3

      - name: Build api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          tags: ohhobastra-api:latest
          load: true
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          tags: ohhobastra-web:latest
          load: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}
            FRONTEND_URL=${{ env.FRONTEND_URL }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Pack images
        run: docker save ohhobastra-api:latest ohhobastra-web:latest | gzip > images.tar.gz

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          echo "IdentityFile ~/.ssh/id_deploy" > ~/.ssh/config
          for i in 1 2 3 4 5 6; do
            if ssh-keyscan -T 15 -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null \
               && [ -s ~/.ssh/known_hosts ]; then
              exit 0
            fi
            echo "Server not answering, retry $i/6..."
            sleep 20
          done
          echo "::error::Could not reach ${{ secrets.EC2_HOST }} over SSH after 6 tries"
          exit 1

      - name: Copy images
        run: scp $SSH_OPTS images.tar.gz "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/tmp/ohhobastra-images.tar.gz"

      - name: Deploy on server
        run: |
          ssh $SSH_OPTS "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "cd ${{ secrets.EC2_APP_DIR }} && git fetch --quiet origin && git checkout --quiet --force ${{ github.sha }} \
             && bash scripts/deploy-server.sh ${{ github.sha }} /tmp/ohhobastra-images.tar.gz"
